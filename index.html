
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOTON</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
.main{
background-color: white;
}
.photon{
display:flex;
justify-content: space-between;
align-items: center;
background-color: white;
height: 50px;
position:fixed;
top: 0;
width: 100%;
z-index: 9999;

}
.navlinks{
display:flex;
gap:20px;
margin-left: 20px;

}
.navlinks a{
text-decoration: none;
color:black;
margin-right: 20px;
gap:20px
}
.photon i{
    margin-left: 20px;
    gap:20px;
    color: #150606;
}
.dropdown{
    position: relative;
    display:inline-block;
    z-index:9999;
}
.dropdown-menu{
display:none;
position: absolute;
top:100%;
left:0;
background-color: #ffffff;
min-width: 160px;
box-shadow:0px 8px 16px rgba(o,o,o,o,1);
list-style: none;
padding: 10px 0px ;
margin:0;
z-index: 9999;
}
.dropdown-menu li a{
color: #333;
padding:8px 16px;
text-decoration: none;
display:block;
}
.dropdown:hover .dropdown-menu{
display:block
}
.herosection {
display:flex;
justify-content: center;
align-items: center;
width:100%;
max-width:100%;
margin:0 auto;
gap:20px;
padding: 20px 0;
margin-top: 80px;
}

.card{
    position: relative;
    width:33.33%;
    height:450px;
    overflow:hidden;
    box-sizing: border-box;
    z-index: 1;
}
.card img{
width:100%;
height:100%;
object-fit: cover;
display: block;
}
.overlay{
position: absolute;
top:0;
left:0;
width: 100%;
height:100%;
background: rgba(o,o,o,o,0.4);
display:flex;
flex-direction: column;
justify-content: center;
align-items: center;
color:#e6deca;
text-align :center;
}
.overlay h2{
font-size: 32px;
color: #ffffff;
margin-bottom: 15px;
font-family: sans-serif;
}
.overlay button{
    background: transparent;
    color:#e6deca;
    border:1px solid white;
    padding:10px 20px;
font-size: 12px;
letter-spacing: 2px;
cursor:pointer;
transition:0.3s ease;
}
.overlay button:hover{
    background: white;
color: black;
}
.card:hover img{
    transition: 5.5s;
}

    </style>
</head>
<body class="main">
    <nav>
<div class="photon">
<h1>PHOTON</h1>
<div class="navlinks">
<a href="#">HOME</a>
<div class="dropdown">
    <a href="#">GALLERY<i class="fa-solid fa-chevron-down"></i></a>
<ul class="dropdown-menu">
<li><a href="#">Nature</a></li>
<li><a href="#">Sports</a></li>
<li><a href="#">Portrait</a></li>
<li><a href="#">Animals</a></li>
<li><a href="#">People</a></li>
<li><a href="#">Architecture</a></li>
</ul>
    </div>
<a href="#">BLOG</a>
<a href="#">SERVICES</a>
<a href="#">ABOUT</a>
</div>
<div class="icons">
<a><i class="fa-brands fa-facebook-f"></i></a>
<a><i class="fa-brands fa-instagram"></i></a>
<a><i class="fa-brands fa-twitter"></i></a>
<a><i class="fa-brands fa-youtube"></i></a>
</div>
</div>
</div>
    </nav>
<div class="herosection">
    <div class="card">
    <img src="images/img_1.webp" alt="Nature">
 <div class="overlay">
<h2>Nature</h2>
<button>MORE PHOTOS</button>
    </div>
    </div>
     <div class="card">
     <img src="images/img_2.webp" alt="Portrait">
<div class="overlay">
    <h2>Portrait</h2>
<button>MORE PHOTOS</button>
</div>
</div>
<div class="card">
<img src="images/img_3.webp" alt="People">
<div class="overlay">
<h2>People</h2>
<button>MORE PHOTOS</button>
</div>
</div>
</div>
</body>
</html>
